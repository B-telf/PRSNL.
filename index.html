<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Loop Playground</title>
    <link rel="stylesheet" href="./demo/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="stage-wrap">
        <header class="brand"><span class="bar"></span>PRSNL / LOOP</header>
        <div id="stage" class="stage"></div>
        <p class="hint">Tap Loop · drag to carry · tap empty space to send it there</p>
      </section>

      <aside class="panel" aria-label="Loop controls">
        <h1>Loop playground</h1>

        <div class="group">
          <h2>State</h2>
          <div class="seg" data-control="state"></div>
        </div>
        <div class="group">
          <h2>Gestures</h2>
          <div class="chips" data-control="gesture"></div>
        </div>
        <div class="group">
          <h2>Expression</h2>
          <div class="chips" data-control="expression"></div>
        </div>
        <div class="group">
          <h2>Skin</h2>
          <div class="seg" data-control="skin"></div>
        </div>
        <div class="group two">
          <div>
            <h2>Eyes</h2>
            <div class="seg" data-control="eyes"></div>
          </div>
          <div>
            <h2>Eye style</h2>
            <div class="seg" data-control="eyeStyle"></div>
          </div>
        </div>
        <div class="group two">
          <div>
            <h2>Motion</h2>
            <div class="seg" data-control="motion"></div>
          </div>
          <div>
            <h2><label for="glow">Glow</label></h2>
            <input id="glow" type="range" min="0" max="2" step="0.05" value="1" />
          </div>
        </div>
        <div class="group">
          <h2>Model file</h2>
          <button id="download" class="btn">Download loop.glb</button>
        </div>
      </aside>
    </main>
    <script type="module" src="./demo/main.ts"></script>
  </body>
</html>
